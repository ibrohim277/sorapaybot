services:
  - type: web
    name: sorapay
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120"
    # Barcha sozlamalar config/settings.py ichida hardcoded (repo private).
    # Environment variable kiritish shart emas.
